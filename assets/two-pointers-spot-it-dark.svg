<svg xmlns="http://www.w3.org/2000/svg" width="760" height="636" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 636" role="img" aria-label="Two gates, then pointer movement picks the flavor" font-size="13"><defs><marker id="tp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6edf3">Two gates, then pointer movement picks the flavor</text><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M430 80H505" marker-end="url(#tp-arrow)"></path><path d="M280 108V140" marker-end="url(#tp-arrow)"></path><path d="M430 168H505" marker-end="url(#tp-arrow)"></path><path d="M280 196V234" marker-end="url(#tp-arrow)"></path><path d="M280 278V300M136 300H624"></path><path d="M136 300V324" marker-end="url(#tp-arrow)"></path><path d="M380 300V324" marker-end="url(#tp-arrow)"></path><path d="M624 300V324" marker-end="url(#tp-arrow)"></path></g><text x="467" y="72" text-anchor="middle" font-size="11.5" fill="#9198a1">no</text><text x="290" y="128" font-size="11.5" fill="#9198a1">yes</text><text x="467" y="160" text-anchor="middle" font-size="11.5" fill="#9198a1">yes</text><text x="290" y="219" font-size="11.5" fill="#9198a1">no</text><g><rect x="130" y="52" width="300" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="280" text-anchor="middle" fill="#e6edf3"><tspan x="280" y="76" font-weight="600" fill="#e6edf3">Linear sequence?</tspan><tspan x="280" y="94" font-size="11.5" fill="#9198a1">array, string, linked list</tspan></text></g><g><rect x="505" y="52" width="230" height="56" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1.25"></rect><text x="620" text-anchor="middle" fill="#e6edf3"><tspan x="620" y="76" fill="#e6edf3">Not two pointers</tspan><tspan x="620" y="94" font-size="11.5" fill="#9198a1">graph, tree, heap, DP</tspan></text></g><g><rect x="130" y="140" width="300" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="280" text-anchor="middle" fill="#e6edf3"><tspan x="280" y="164" font-weight="600" fill="#e6edf3">Care about the range between?</tspan><tspan x="280" y="182" font-size="11.5" fill="#9198a1">sum, count, distinct inside</tspan></text></g><g><rect x="505" y="140" width="230" height="56" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1.25"></rect><text x="620" text-anchor="middle" fill="#e6edf3"><tspan x="620" y="164" fill="#e6edf3">Sliding window</tspan><tspan x="620" y="182" font-size="11.5" fill="#9198a1">see the sliding window doc</tspan></text></g><g><rect x="150" y="234" width="260" height="44" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="280" y="260" text-anchor="middle" font-weight="600" fill="#e6edf3">How do the pointers move?</text></g><g><rect x="24" y="324" width="224" height="288" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="136" y="346" text-anchor="middle" font-weight="600" fill="#e6edf3">Opposite ends</text></g><g><rect x="268" y="324" width="224" height="204" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="380" y="346" text-anchor="middle" font-weight="600" fill="#e6edf3">Same direction</text></g><g><rect x="512" y="324" width="224" height="120" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="624" y="346" text-anchor="middle" font-weight="600" fill="#e6edf3">Two inputs</text></g><g><rect x="40" y="356" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="136" y="380" text-anchor="middle" font-weight="600" fill="#e6edf3">A · Pair sum</text><text x="136" y="396" text-anchor="middle" font-size="11.5" fill="#9198a1">sorted, pair or triplet</text><text x="136" y="412" text-anchor="middle" font-size="11.5" fill="#e6edf3">sum &lt; t: l++ · else r--</text></g><g><rect x="40" y="440" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="136" y="464" text-anchor="middle" font-weight="600" fill="#e6edf3">B · Weaker side</text><text x="136" y="480" text-anchor="middle" font-size="11.5" fill="#9198a1">most water, trap rain</text><text x="136" y="496" text-anchor="middle" font-size="11.5" fill="#e6edf3">move the shorter wall</text></g><g><rect x="40" y="524" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="136" y="548" text-anchor="middle" font-weight="600" fill="#e6edf3">C · Mirror</text><text x="136" y="564" text-anchor="middle" font-size="11.5" fill="#9198a1">palindrome, reverse</text><text x="136" y="580" text-anchor="middle" font-size="11.5" fill="#e6edf3">compare, then l++ r--</text></g><g><rect x="284" y="356" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="380" y="380" text-anchor="middle" font-weight="600" fill="#e6edf3">D · Read / write</text><text x="380" y="396" text-anchor="middle" font-size="11.5" fill="#9198a1">in-place remove, dedupe</text><text x="380" y="412" text-anchor="middle" font-size="11.5" fill="#e6edf3">write++ only on keep</text></g><g><rect x="284" y="440" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="380" y="464" text-anchor="middle" font-weight="600" fill="#e6edf3">E · Fast / slow</text><text x="380" y="480" text-anchor="middle" font-size="11.5" fill="#9198a1">cycle, middle, k-th last</text><text x="380" y="496" text-anchor="middle" font-size="11.5" fill="#e6edf3">fast 2 steps, slow 1</text></g><g><rect x="528" y="356" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="624" y="380" text-anchor="middle" font-weight="600" fill="#e6edf3">F · Merge</text><text x="624" y="396" text-anchor="middle" font-size="11.5" fill="#9198a1">two sorted arrays, lists</text><text x="624" y="412" text-anchor="middle" font-size="11.5" fill="#e6edf3">advance the smaller</text></g></svg>
