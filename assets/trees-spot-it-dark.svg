<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 552" role="img" aria-label="Two gates, then what each node needs picks the flavor" font-size="13"><defs><marker id="tr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6edf3">Two gates, then what each node needs picks the flavor</text><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M430 80H505" marker-end="url(#tr-arrow)"></path><path d="M280 108V140" marker-end="url(#tr-arrow)"></path><path d="M430 168H513" marker-end="url(#tr-arrow)"></path><path d="M280 196V234" marker-end="url(#tr-arrow)"></path><path d="M280 278V300M136 300H624"></path><path d="M136 300V324" marker-end="url(#tr-arrow)"></path><path d="M380 300V324" marker-end="url(#tr-arrow)"></path><path d="M624 300V324" marker-end="url(#tr-arrow)"></path></g><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M624 204V256H410" stroke-dasharray="4 4" marker-end="url(#tr-arrow)"></path></g><text x="517" y="248" text-anchor="middle" font-size="11.5" fill="#9198a1">then pick A–E</text><text x="467" y="72" text-anchor="middle" font-size="11.5" fill="#9198a1">no</text><text x="290" y="128" font-size="11.5" fill="#9198a1">yes</text><text x="471" y="160" text-anchor="middle" font-size="11.5" fill="#9198a1">yes</text><text x="290" y="219" font-size="11.5" fill="#9198a1">no</text><g><rect x="130" y="52" width="300" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="280" text-anchor="middle" fill="#e6edf3"><tspan x="280" y="76" font-weight="600" fill="#e6edf3">Hierarchy, no cycles?</tspan><tspan x="280" y="94" font-size="11.5" fill="#9198a1">TreeNode, or n nodes and n − 1 edges</tspan></text></g><g><rect x="505" y="52" width="230" height="56" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1.25"></rect><text x="620" text-anchor="middle" fill="#e6edf3"><tspan x="620" y="76" fill="#e6edf3">Not a tree</tspan><tspan x="620" y="94" font-size="11.5" fill="#9198a1">graph: BFS, DFS, union-find</tspan></text></g><g><rect x="130" y="140" width="300" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="280" text-anchor="middle" fill="#e6edf3"><tspan x="280" y="164" font-weight="600" fill="#e6edf3">Given as an edge list?</tspan><tspan x="280" y="182" font-size="11.5" fill="#9198a1">int[][] edges, not TreeNode</tspan></text></g><g><rect x="513" y="132" width="222" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="624" y="156" text-anchor="middle" font-weight="600" fill="#e6edf3">F · Edge-list tree</text><text x="624" y="172" text-anchor="middle" font-size="11.5" fill="#9198a1">n nodes, n − 1 edges</text><text x="624" y="188" text-anchor="middle" font-size="11.5" fill="#e6edf3">build adj, skip parent</text></g><g><rect x="150" y="234" width="260" height="44" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="280" y="260" text-anchor="middle" font-weight="600" fill="#e6edf3">What does each node need?</text></g><g><rect x="24" y="324" width="224" height="204" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="136" y="346" text-anchor="middle" font-weight="600" fill="#e6edf3">Depth-first</text></g><g><rect x="268" y="324" width="224" height="120" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="380" y="346" text-anchor="middle" font-weight="600" fill="#e6edf3">Breadth-first</text></g><g><rect x="512" y="324" width="224" height="204" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="624" y="346" text-anchor="middle" font-weight="600" fill="#e6edf3">Shape and order</text></g><g><rect x="40" y="356" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="136" y="380" text-anchor="middle" font-weight="600" fill="#e6edf3">A · Top-down DFS</text><text x="136" y="396" text-anchor="middle" font-size="11.5" fill="#9198a1">path sum, valid BST</text><text x="136" y="412" text-anchor="middle" font-size="11.5" fill="#e6edf3">pass state into children</text></g><g><rect x="40" y="440" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="136" y="464" text-anchor="middle" font-weight="600" fill="#e6edf3">B · Bottom-up DFS</text><text x="136" y="480" text-anchor="middle" font-size="11.5" fill="#9198a1">height, diameter, LCA</text><text x="136" y="496" text-anchor="middle" font-size="11.5" fill="#e6edf3">return info to parent</text></g><g><rect x="284" y="356" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="380" y="380" text-anchor="middle" font-weight="600" fill="#e6edf3">C · Level order</text><text x="380" y="396" text-anchor="middle" font-size="11.5" fill="#9198a1">per level, right view</text><text x="380" y="412" text-anchor="middle" font-size="11.5" fill="#e6edf3">queue + size per level</text></g><g><rect x="528" y="356" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="624" y="380" text-anchor="middle" font-weight="600" fill="#e6edf3">D · BST order</text><text x="624" y="396" text-anchor="middle" font-size="11.5" fill="#9198a1">k-th smallest, BST LCA</text><text x="624" y="412" text-anchor="middle" font-size="11.5" fill="#e6edf3">inorder = sorted</text></g><g><rect x="528" y="440" width="192" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="624" y="464" text-anchor="middle" font-weight="600" fill="#e6edf3">E · Build / encode</text><text x="624" y="480" text-anchor="middle" font-size="11.5" fill="#9198a1">from traversals, serialize</text><text x="624" y="496" text-anchor="middle" font-size="11.5" fill="#e6edf3">root first, then split</text></g></svg>
