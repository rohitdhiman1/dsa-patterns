<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 420" role="img" aria-label="Two gates, then the ask picks the window flavor" font-size="13"><defs><marker id="sw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#e6edf3">Two gates, then the ask picks the window flavor</text><g fill="none" stroke="#6e7681" stroke-width="1.25"><path d="M430 80H505" marker-end="url(#sw-arrow)"></path><path d="M280 104V140" marker-end="url(#sw-arrow)"></path><path d="M430 168H505" marker-end="url(#sw-arrow)"></path><path d="M280 196V234" marker-end="url(#sw-arrow)"></path><path d="M280 278V300M92 300H668"></path><path d="M92 300V324" marker-end="url(#sw-arrow)"></path><path d="M236 300V324" marker-end="url(#sw-arrow)"></path><path d="M380 300V324" marker-end="url(#sw-arrow)"></path><path d="M524 300V324" marker-end="url(#sw-arrow)"></path><path d="M668 300V324" marker-end="url(#sw-arrow)"></path></g><text x="467" y="72" text-anchor="middle" font-size="11.5" fill="#9198a1">no</text><text x="290" y="126" font-size="11.5" fill="#9198a1">yes</text><text x="467" y="160" text-anchor="middle" font-size="11.5" fill="#9198a1">no</text><text x="290" y="219" font-size="11.5" fill="#9198a1">yes</text><g><rect x="130" y="56" width="300" height="48" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="280" y="84" text-anchor="middle" font-weight="600" fill="#e6edf3">Contiguous subarray or substring?</text></g><g><rect x="505" y="56" width="230" height="48" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1.25"></rect><text x="620" y="84" text-anchor="middle" fill="#e6edf3">Not a window: DP, heap, sort</text></g><g><rect x="130" y="140" width="300" height="56" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="280" text-anchor="middle" fill="#e6edf3"><tspan x="280" y="164" font-weight="600" fill="#e6edf3">Validity moves one way?</tspan><tspan x="280" y="182" font-size="11.5" fill="#9198a1">all positives, counts, distinct</tspan></text></g><g><rect x="505" y="140" width="230" height="56" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1.25"></rect><text x="620" text-anchor="middle" fill="#e6edf3"><tspan x="620" y="164" fill="#e6edf3">Prefix sum + HashMap</tspan><tspan x="620" y="182" font-size="11.5" fill="#9198a1">or deque · LC 560, 862</tspan></text></g><g><rect x="150" y="234" width="260" height="44" rx="8" fill="none" stroke="#6e7681" stroke-width="1.25"></rect><text x="280" y="260" text-anchor="middle" font-weight="600" fill="#e6edf3">What does the ask want?</text></g><g><rect x="24" y="324" width="136" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="92" y="348" text-anchor="middle" font-weight="600" fill="#e6edf3">A · Fixed k</text><text x="92" y="364" text-anchor="middle" font-size="11.5" fill="#9198a1">size k, anagram</text><text x="92" y="380" text-anchor="middle" font-size="11.5" fill="#e6edf3">record at size k</text></g><g><rect x="168" y="324" width="136" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="236" y="348" text-anchor="middle" font-weight="600" fill="#e6edf3">B · Shortest</text><text x="236" y="364" text-anchor="middle" font-size="11.5" fill="#9198a1">minimum length</text><text x="236" y="380" text-anchor="middle" font-size="11.5" fill="#e6edf3">record INSIDE</text></g><g><rect x="312" y="324" width="136" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="380" y="348" text-anchor="middle" font-weight="600" fill="#e6edf3">C · Longest</text><text x="380" y="364" text-anchor="middle" font-size="11.5" fill="#9198a1">longest, at most K</text><text x="380" y="380" text-anchor="middle" font-size="11.5" fill="#e6edf3">record AFTER</text></g><g><rect x="456" y="324" width="136" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="524" y="348" text-anchor="middle" font-weight="600" fill="#e6edf3">D · Count</text><text x="524" y="364" text-anchor="middle" font-size="11.5" fill="#9198a1">count, exactly K</text><text x="524" y="380" text-anchor="middle" font-size="11.5" fill="#e6edf3">count += r−l+1</text></g><g><rect x="600" y="324" width="136" height="72" rx="8" fill="#5b9cff" fill-opacity="0.12" stroke="#5b9cff" stroke-width="2"></rect><text x="668" y="348" text-anchor="middle" font-weight="600" fill="#e6edf3">E · Window max</text><text x="668" y="364" text-anchor="middle" font-size="11.5" fill="#9198a1">max of each window</text><text x="668" y="380" text-anchor="middle" font-size="11.5" fill="#e6edf3">monotonic deque</text></g></svg>
