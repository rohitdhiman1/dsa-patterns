<svg xmlns="http://www.w3.org/2000/svg" width="760" height="636" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 760 636" role="img" aria-label="Two gates, then what lives in the heap picks the flavor" font-size="13"><defs><marker id="hp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Two gates, then what lives in the heap picks the flavor</text><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M430 80H505" marker-end="url(#hp-arrow)"></path><path d="M280 108V140" marker-end="url(#hp-arrow)"></path><path d="M430 168H505" marker-end="url(#hp-arrow)"></path><path d="M280 196V234" marker-end="url(#hp-arrow)"></path><path d="M280 278V300M136 300H624"></path><path d="M136 300V324" marker-end="url(#hp-arrow)"></path><path d="M380 300V324" marker-end="url(#hp-arrow)"></path><path d="M624 300V324" marker-end="url(#hp-arrow)"></path></g><text x="467" y="72" text-anchor="middle" font-size="11.5" fill="#59636e">no</text><text x="290" y="128" font-size="11.5" fill="#59636e">yes</text><text x="467" y="160" text-anchor="middle" font-size="11.5" fill="#59636e">yes</text><text x="290" y="219" font-size="11.5" fill="#59636e">no</text><g><rect x="130" y="52" width="300" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="280" text-anchor="middle" fill="#1f2328"><tspan x="280" y="76" font-weight="600" fill="#1f2328">Best item needed repeatedly?</tspan><tspan x="280" y="94" font-size="11.5" fill="#59636e">the set changes between picks</tspan></text></g><g><rect x="505" y="52" width="230" height="56" rx="8" fill="#eef1f4" stroke="#8c959f" stroke-width="1.25"></rect><text x="620" text-anchor="middle" fill="#1f2328"><tspan x="620" y="76" fill="#1f2328">Sort once</tspan><tspan x="620" y="94" font-size="11.5" fill="#59636e">or quickselect for one k-th</tspan></text></g><g><rect x="130" y="140" width="300" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="280" text-anchor="middle" fill="#1f2328"><tspan x="280" y="164" font-weight="600" fill="#1f2328">Best of a sliding window?</tspan><tspan x="280" y="182" font-size="11.5" fill="#59636e">max of every window of size k</tspan></text></g><g><rect x="505" y="140" width="230" height="56" rx="8" fill="#eef1f4" stroke="#8c959f" stroke-width="1.25"></rect><text x="620" text-anchor="middle" fill="#1f2328"><tspan x="620" y="164" fill="#1f2328">Monotonic deque</tspan><tspan x="620" y="182" font-size="11.5" fill="#59636e">see sliding window doc · E</tspan></text></g><g><rect x="150" y="234" width="260" height="44" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="280" y="260" text-anchor="middle" font-weight="600" fill="#1f2328">What lives in the heap?</text></g><g><rect x="24" y="324" width="224" height="288" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="136" y="346" text-anchor="middle" font-weight="600" fill="#1f2328">Selection</text></g><g><rect x="268" y="324" width="224" height="120" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="380" y="346" text-anchor="middle" font-weight="600" fill="#1f2328">Merging</text></g><g><rect x="512" y="324" width="224" height="204" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"></rect><text x="624" y="346" text-anchor="middle" font-weight="600" fill="#1f2328">Scheduling and graphs</text></g><g><rect x="40" y="356" width="192" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="136" y="380" text-anchor="middle" font-weight="600" fill="#1f2328">A · Top K</text><text x="136" y="396" text-anchor="middle" font-size="11.5" fill="#59636e">k largest, k most frequent</text><text x="136" y="412" text-anchor="middle" font-size="11.5" fill="#1f2328">min-heap capped at size k</text></g><g><rect x="40" y="440" width="192" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="136" y="464" text-anchor="middle" font-weight="600" fill="#1f2328">B · Two heaps</text><text x="136" y="480" text-anchor="middle" font-size="11.5" fill="#59636e">running median</text><text x="136" y="496" text-anchor="middle" font-size="11.5" fill="#1f2328">balance two halves</text></g><g><rect x="40" y="524" width="192" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="136" y="548" text-anchor="middle" font-weight="600" fill="#1f2328">C · Repeat best</text><text x="136" y="564" text-anchor="middle" font-size="11.5" fill="#59636e">smash stones, join ropes</text><text x="136" y="580" text-anchor="middle" font-size="11.5" fill="#1f2328">poll two, push result</text></g><g><rect x="284" y="356" width="192" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="380" y="380" text-anchor="middle" font-weight="600" fill="#1f2328">D · K-way merge</text><text x="380" y="396" text-anchor="middle" font-size="11.5" fill="#59636e">merge k sorted lists</text><text x="380" y="412" text-anchor="middle" font-size="11.5" fill="#1f2328">heap of each list's head</text></g><g><rect x="528" y="356" width="192" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="624" y="380" text-anchor="middle" font-weight="600" fill="#1f2328">E · Schedule / sweep</text><text x="624" y="396" text-anchor="middle" font-size="11.5" fill="#59636e">meeting rooms, IPO, tasks</text><text x="624" y="412" text-anchor="middle" font-size="11.5" fill="#1f2328">sort, then heap the active</text></g><g><rect x="528" y="440" width="192" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="624" y="464" text-anchor="middle" font-weight="600" fill="#1f2328">F · Dijkstra</text><text x="624" y="480" text-anchor="middle" font-size="11.5" fill="#59636e">cheapest path, weights ≥ 0</text><text x="624" y="496" text-anchor="middle" font-size="11.5" fill="#1f2328">poll min dist, skip stale</text></g></svg>
